name: Publish to Thunderstore

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: thunderstore-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the release package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release download --repo "$GH_REPO" --pattern 'ClassicLegacyUI-*.zip' --dir package -- "$RELEASE_TAG"

      - name: Validate the package
        id: package
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import zipfile

          packages = list(pathlib.Path("package").glob("*.zip"))
          if len(packages) != 1:
              raise SystemExit("Attach exactly one ClassicLegacyUI ZIP to the release.")
          with zipfile.ZipFile(packages[0]) as archive:
              expected = {"manifest.json", "README.md", "LICENSE", "icon.png", "plugins/ClassicLegacyUI.dll"}
              if len(archive.namelist()) != len(expected) or set(archive.namelist()) != expected:
                  raise SystemExit("Unexpected package contents.")
              if archive.testzip() is not None:
                  raise SystemExit("The package ZIP is corrupt.")
              manifest = json.loads(archive.read("manifest.json"))
          version = manifest.get("version_number", "")
          if manifest.get("name") != "ClassicLegacyUI" or not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("Invalid package name or version.")
          packages[0].rename("package.zip")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"Validated ClassicLegacyUI {version}.")
          PY

      - name: Download the official Thunderstore CLI
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tcli.tar.gz" \
            https://github.com/thunderstore-io/thunderstore-cli/releases/download/0.2.4/tcli-0.2.4-linux-x64.tar.gz
          echo "bd7df48875e0c819a23a3bfaccf493c8cdf45288d9445558157a51126d0eab32  $RUNNER_TEMP/tcli.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tcli.tar.gz" -C "$RUNNER_TEMP"

      - name: Publish the package
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [ -z "$TCLI_AUTH_TOKEN" ]; then
            echo "::error::Set the THUNDERSTORE_TOKEN repository secret first."
            exit 1
          fi
          cat > "$RUNNER_TEMP/thunderstore.toml" <<'TOML'
          [package]
          namespace = "markn2000"
          name = "ClassicLegacyUI"
          [publish]
          repository = "https://thunderstore.io"
          communities = ["resonite"]
          [publish.categories]
          resonite = ["mods", "visualtweaks", "ai-generated"]
          TOML
          "$RUNNER_TEMP/tcli-0.2.4-linux-x64/tcli" publish \
            --config-path "$RUNNER_TEMP/thunderstore.toml" \
            --package-version "$PACKAGE_VERSION" --file package.zip
